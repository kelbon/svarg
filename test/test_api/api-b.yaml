openapi: 3.1.0
info:
  title: API B
  version: 1.0.0

paths:
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - $ref: 'api-a.yaml#/components/parameters/LimitParam'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: false
        default:
          description: Unexpected error
          content:
            application/json:
              schema: true

  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                minLength: 1

components:
  schemas:
    Item:
      type: object
      required: [id, title, price]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/Money'
        tags:
          type: array
          items:
            type: string
            minLength: 1

    Money:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          enum: [USD, EUR, RUB]

    Order:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        item:
          $ref: '#/components/schemas/Item'
          readOnly: true
        buyer:
          $ref: 'api-a.yaml#/components/schemas/User'

    Error:
      type: object
      properties:
        code:
          type: integer
          minimum: 0
        message:
          type: string
          minLength: 1
      patternProperties:
        "^x-":
          type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

security:
  - ApiKeyAuth: []
