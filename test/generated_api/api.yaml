openapi: 3.1.0
info:
  title: generated server/client test
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
  - url: https://staging.example.com/v1/
paths:
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: tag
          in: query
          schema:
            type: string
            default: all
        # имя хедера в любом регистре - поле и хедер в нижнем
        - name: X-Request-Id
          in: header
          schema:
            type: string
        - name: x-trace
          in: header
          content:
            application/json:
              schema:
                type: string
      responses:
        "200":
          description: item name
          headers:
            x-version:
              schema:
                type: integer
                default: 1
          content:
            application/json:
              schema:
                type: string
        default:
          description: error
  /upload:
    post:
      operationId: upload
      servers:
        - url: https://upload.example.com/v2
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              minLength: 1
      responses:
        "204":
          description: done
  /notes:
    post:
      operationId: addNote
      requestBody:
        content:
          application/json:
            schema:
              type: string
          application/vnd.note+json:
            schema:
              type: integer
      responses:
        "204":
          description: added
  /items/{id}/data:
    put:
      operationId: putItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: stored item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: string
                remember:
                  type: boolean
                  default: false
                attempts:
                  type: integer
                meta:
                  type: string
            encoding:
              meta:
                contentType: application/json
      responses:
        "200":
          description: greeting
          content:
            text/plain:
              schema:
                type: string
  /files:
    post:
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                size:
                  type: integer
                meta:
                  $ref: "#/components/schemas/Item"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: summary
          content:
            text/plain:
              schema:
                type: string
  /messages:
    post:
      operationId: transfer
      requestBody:
        required: true
        content:
          multipart/related:
            schema:
              type: object
              properties:
                jsonData:
                  $ref: "#/components/schemas/Item"
                binaryN1:
                  type: string
                  format: binary
                binaryN2:
                  type: string
                  format: binary
            encoding:
              jsonData:
                contentType: application/json
              binaryN1:
                contentType: application/vnd.3gpp.5gnas
                headers:
                  Content-Id:
                    schema:
                      type: string
              binaryN2:
                contentType: application/vnd.3gpp.ngap
                headers:
                  Content-Id:
                    schema:
                      type: string
      responses:
        "200":
          description: echo
          content:
            multipart/related:
              schema:
                type: object
                properties:
                  jsonData:
                    $ref: "#/components/schemas/Item"
                  binaryN2:
                    type: string
                    format: binary
              encoding:
                jsonData:
                  contentType: application/json
                binaryN2:
                  contentType: application/vnd.3gpp.ngap
                  headers:
                    Content-Id:
                      schema:
                        type: string
  /files/{name}.{ext}:
    get:
      operationId: getFile
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: ext
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: name and extension
          content:
            text/plain:
              schema:
                type: string
  /search:
    get:
      operationId: search
      parameters:
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: filter
          in: query
          explode: false
          schema:
            type: object
            properties:
              color:
                type: string
              min:
                type: integer
        - name: point
          in: query
          schema:
            type: object
            required: [x]
            properties:
              x:
                type: integer
              y:
                type: integer
        - name: x-list
          in: header
          schema:
            type: array
            items:
              type: string
        - name: prefs
          in: cookie
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: parsed parameters
          content:
            text/plain:
              schema:
                type: string
  /cells/{cell}/{tags}:
    get:
      operationId: getCell
      parameters:
        - name: cell
          in: path
          required: true
          explode: true
          schema:
            type: object
            required: [row, col]
            properties:
              row:
                type: integer
              col:
                type: integer
        - name: tags
          in: path
          required: true
          style: simple
          schema:
            type: array
            items:
              type: string
            minItems: 1
      responses:
        "200":
          description: parsed parameters
          content:
            text/plain:
              schema:
                type: string
  /kv:
    post:
      operationId: postKv
      requestBody:
        required: true
        content:
          application/vnd.test+kv:
            schema:
              type: object
              required: [a]
              properties:
                a:
                  type: string
                n:
                  type: integer
      responses:
        "200":
          description: свои кодеки (test_codecs.hpp)
          content:
            application/x-upper:
              schema:
                type: string
  /blobs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBlob
      responses:
        "200":
          description: бинарное тело без схемы (3.1), поток по умолчанию
          content:
            application/octet-stream: {}
        "404":
          description: нет такого
          content:
            application/json:
              schema:
                type: string
    put:
      operationId: putBlob
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200":
          description: размер полученного
          content:
            text/plain:
              schema:
                type: integer
  /events:
    get:
      operationId: getEvents
      responses:
        "200":
          description: поток (--stream-content-type text/event-stream)
          headers:
            x-count:
              required: true
              schema:
                type: integer
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
        count:
          type: integer
          default: 3
        kind:
          $ref: "#/components/schemas/Kind"
        mode:
          type: string
          enum: [fast, slow]
          default: slow
        tags:
          type: array
          items:
            type: string
          default: [x]
        child:
          $ref: "#/components/schemas/Item"
        color:
          $ref: "#/components/schemas/Color"
        filter:
          $ref: "#/components/schemas/Filter"
    # not как требование (как NfTypeCond в 3GPP TS 29.510): поля other быть не должно
    Filter:
      type: object
      required: [kind]
      not:
        required: [other]
      properties:
        kind:
          type: string
    # расширяемое перечисление: известные значения + любая строка (открытый enum)
    Color:
      anyOf:
        - type: string
          enum: [red, green, value]
        - type: string
    Kind:
      type: string
      enum: [a, b]
      default: b
