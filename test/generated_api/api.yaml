openapi: 3.1.0
info:
  title: generated server/client test
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
  - url: https://staging.example.com/v1/
paths:
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: tag
          in: query
          schema:
            type: string
            default: all
        - name: x-trace
          in: header
          content:
            application/json:
              schema:
                type: string
      responses:
        "200":
          description: item name
          headers:
            x-version:
              schema:
                type: integer
                default: 1
          content:
            application/json:
              schema:
                type: string
        default:
          description: error
  /upload:
    post:
      operationId: upload
      servers:
        - url: https://upload.example.com/v2
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              minLength: 1
      responses:
        "204":
          description: done
  /notes:
    post:
      operationId: addNote
      requestBody:
        content:
          application/json:
            schema:
              type: string
          application/vnd.note+json:
            schema:
              type: integer
      responses:
        "204":
          description: added
  /items/{id}/data:
    put:
      operationId: putItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: stored item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: string
                remember:
                  type: boolean
                  default: false
                attempts:
                  type: integer
                meta:
                  type: string
            encoding:
              meta:
                contentType: application/json
      responses:
        "200":
          description: greeting
          content:
            text/plain:
              schema:
                type: string
  /files:
    post:
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                size:
                  type: integer
                meta:
                  $ref: "#/components/schemas/Item"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: summary
          content:
            text/plain:
              schema:
                type: string
  /messages:
    post:
      operationId: transfer
      requestBody:
        required: true
        content:
          multipart/related:
            schema:
              type: object
              properties:
                jsonData:
                  $ref: "#/components/schemas/Item"
                binaryN1:
                  type: string
                  format: binary
                binaryN2:
                  type: string
                  format: binary
            encoding:
              jsonData:
                contentType: application/json
              binaryN1:
                contentType: application/vnd.3gpp.5gnas
                headers:
                  Content-Id:
                    schema:
                      type: string
              binaryN2:
                contentType: application/vnd.3gpp.ngap
                headers:
                  Content-Id:
                    schema:
                      type: string
      responses:
        "200":
          description: echo
          content:
            multipart/related:
              schema:
                type: object
                properties:
                  jsonData:
                    $ref: "#/components/schemas/Item"
                  binaryN2:
                    type: string
                    format: binary
              encoding:
                jsonData:
                  contentType: application/json
                binaryN2:
                  contentType: application/vnd.3gpp.ngap
                  headers:
                    Content-Id:
                      schema:
                        type: string
  /files/{name}.{ext}:
    get:
      operationId: getFile
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: ext
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: name and extension
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
        count:
          type: integer
          default: 3
        kind:
          $ref: "#/components/schemas/Kind"
        mode:
          type: string
          enum: [fast, slow]
          default: slow
        tags:
          type: array
          items:
            type: string
          default: [x]
        child:
          $ref: "#/components/schemas/Item"
    Kind:
      type: string
      enum: [a, b]
      default: b
