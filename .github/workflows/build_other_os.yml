name: build_other_os

'on':
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || !github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-clang
          - os: macos-latest
            name: macos-clang
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # официальная сборка clang 23 и lld, nasm для AWS-LC (TLS в hidi)
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja nasm -y
          echo "C:\Program Files\NASM" >> $GITHUB_PATH
          mkdir -p /c/llvm
          curl -sSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/clang+llvm-23.1.5-x86_64-pc-windows-msvc.tar.xz \
            | tar -xJ -C /c/llvm --strip-components=1
          echo "SVARG_CXX=C:/llvm/bin/clang++.exe" >> $GITHUB_ENV
          echo "SVARG_CC=C:/llvm/bin/clang.exe" >> $GITHUB_ENV
          echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV

      # clang из Homebrew (сейчас 23) со своей libc++: системная libc++ отстаёт по C++23
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          LLVM=$(brew --prefix llvm)
          echo "SVARG_CXX=$LLVM/bin/clang++" >> $GITHUB_ENV
          echo "SVARG_CC=$LLVM/bin/clang" >> $GITHUB_ENV
          echo "LDFLAGS=-L$LLVM/lib/c++ -L$LLVM/lib/unwind -lunwind -Wl,-rpath,$LLVM/lib/c++" >> $GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Configure CMake
        env: LLVM: $(brew --prefix llvm)
        run: |
          $SVARG_CXX --version
          cmake . -Dsvarg_ENABLE_TESTING=ON              \
            -Dsvarg_CI=ON                                 \
            -DCMAKE_BUILD_TYPE=Release                    \
            -DCMAKE_C_COMPILER="$SVARG_CC"                \
            -DCMAKE_CXX_COMPILER="$SVARG_CXX"             \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5            \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache           \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache         \
            -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES="$LLVM/include/c++/v1" \
            -B build -G "Ninja"
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake --build build
      - name: Test
        run: |
          cd build
          ctest --output-on-failure -C Release

      # пример на реальной спеке как отдельный проект: svarg подключается, как у пользователя
      - name: Configure example (as user project)
        run: |
          cmake -S examples/cxx_nrf                       \
            -DCMAKE_BUILD_TYPE=Release                    \
            -DCMAKE_C_COMPILER="$SVARG_CC"                \
            -DCMAKE_CXX_COMPILER="$SVARG_CXX"             \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5            \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache           \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache         \
            -B build_nrf -G "Ninja"
      - name: Build example (as user project)
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake --build build_nrf
      - name: Run example (as user project)
        run: |
          ./build_nrf/svarg_nrf_example
